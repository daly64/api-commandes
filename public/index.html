<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commandes en direct</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f7f7f5; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 16px; }
    h1 { font-size: 1.4rem; color: #3b6e4f; margin: 0; }
    #etat { font-size: .9rem; color: #777; }
    #etat.en-direct { color: #2e7d32; font-weight: 600; }
    #etat.hors-ligne { color: #c62828; }
    #liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
    .carte { background: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); border-top: 6px solid #bbb; }
    .carte h2 { font-size: 1.1rem; margin: 0 0 6px; }
    .carte .heure { font-size: .8rem; color: #888; margin-top: 4px; }
    .carte ul { margin: 8px 0 0; padding-left: 18px; }
    .statut { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #fff; background: #9e9e9e; }
    .en_attente { border-top-color: #9e9e9e; }
    .en_preparation { border-top-color: #f9a825; }
    .en_preparation .statut { background: #f9a825; color: #222; }
    .prete { border-top-color: #2e7d32; }
    .prete .statut { background: #2e7d32; }
    .servie { border-top-color: #1565c0; }
    .servie .statut { background: #1565c0; }
    .vide { color: #777; text-align: center; grid-column: 1 / -1; padding: 40px 0; }
    footer { max-width: 1100px; margin: 24px auto 0; font-size: .85rem; }
    a { color: #3b6e4f; }
  </style>
</head>
<body>
  <header>
    <h1>Commandes en cours</h1>
    <span id="etat">connexion…</span>
  </header>
  <main id="liste"></main>
  <footer><a href="/graphql">Explorateur GraphiQL</a></footer>

  <script>
    // Liste et états des commandes, mis à jour en direct par le flux SSE (abonnement GraphQL)
    const ADRESSE_GRAPHQL = '/graphql';
    const CHAMPS = 'id table statut creeeLe lignes { produit quantite }';
    const REQUETE_LISTE = `{ commandes { ${CHAMPS} } }`;
    const REQUETE_FLUX = `subscription { commandeModifiee { ${CHAMPS} } }`;
    const LIBELLES = { EN_ATTENTE: 'En attente', EN_PREPARATION: 'En préparation', PRETE: 'Prête', SERVIE: 'Servie' };

    const commandes = new Map();
    const liste = document.getElementById('liste');
    const etat = document.getElementById('etat');

    function majEtat(texte, classe = '') {
      etat.textContent = texte;
      etat.className = classe;
    }

    function element(balise, classe, texte) {
      const e = document.createElement(balise);
      if (classe) e.className = classe;
      if (texte !== undefined) e.textContent = texte;
      return e;
    }

    function heure(iso) {
      return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    // Les commandes les plus anciennes d'abord ; le texte est inséré sans interprétation HTML
    function afficher() {
      const triees = [...commandes.values()].sort(
        (a, b) => a.creeeLe.localeCompare(b.creeeLe) || Number(a.id) - Number(b.id),
      );
      liste.replaceChildren();
      if (triees.length === 0) {
        liste.append(element('p', 'vide', 'Aucune commande en cours'));
        return;
      }
      for (const c of triees) {
        const carte = element('article', `carte ${c.statut.toLowerCase()}`);
        const lignes = element('ul');
        for (const l of c.lignes) lignes.append(element('li', '', `${l.quantite} × ${l.produit}`));
        carte.append(
          element('h2', '', `Table ${c.table}`),
          element('span', 'statut', LIBELLES[c.statut] ?? c.statut),
          element('div', 'heure', `Reçue à ${heure(c.creeeLe)}`),
          lignes,
        );
        liste.append(carte);
      }
    }

    function appliquer(commande) {
      if (!commande) return;
      if (commande.statut === 'PAYEE') commandes.delete(commande.id);
      else commandes.set(commande.id, commande);
      afficher();
    }

    function requeter(query, entetes = {}) {
      return fetch(ADRESSE_GRAPHQL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...entetes },
        body: JSON.stringify({ query }),
      });
    }

    async function chargerListe() {
      const { data, errors } = await (await requeter(REQUETE_LISTE)).json();
      if (errors) throw new Error(errors[0].message);
      commandes.clear();
      for (const c of data.commandes) commandes.set(c.id, c);
      afficher();
    }

    // Découpe un bloc SSE (« event: … » et « data: … ») ; renvoie la commande modifiée, s'il y en a une
    function lireBloc(bloc) {
      let evenement = 'message';
      const donnees = [];
      for (const ligne of bloc.split('\n')) {
        if (ligne.startsWith('event:')) evenement = ligne.slice(6).trim();
        else if (ligne.startsWith('data:')) donnees.push(ligne.slice(5).trim());
      }
      if (evenement !== 'next' || donnees.length === 0) return null;
      return JSON.parse(donnees.join('\n')).data?.commandeModifiee ?? null;
    }

    // Boucle de connexion : après chaque coupure (y compris la limite de durée de Vercel), on recharge la liste et on se réabonne
    async function suivre() {
      while (true) {
        try {
          majEtat('connexion…');
          const reponse = await requeter(REQUETE_FLUX, { Accept: 'text/event-stream' });
          if (!reponse.ok || !reponse.body) throw new Error(`statut ${reponse.status}`);

          // Le flux est ouvert avant la liste : aucun changement ne peut se perdre entre les deux
          const lecteur = reponse.body.pipeThrough(new TextDecoderStream()).getReader();
          await chargerListe();
          majEtat('en direct', 'en-direct');

          let tampon = '';
          while (true) {
            const { value, done } = await lecteur.read();
            if (done) break;
            tampon += value;
            let fin;
            while ((fin = tampon.indexOf('\n\n')) !== -1) {
              const bloc = tampon.slice(0, fin);
              tampon = tampon.slice(fin + 2);
              appliquer(lireBloc(bloc));
            }
          }
          majEtat('reconnexion…', 'hors-ligne');
        } catch {
          majEtat('hors ligne, nouvelle tentative…', 'hors-ligne');
        }
        await new Promise((resoudre) => setTimeout(resoudre, 2000));
      }
    }

    suivre();
  </script>
</body>
</html>
